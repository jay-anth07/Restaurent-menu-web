                                <div class="p-5 flex flex-col flex-grow">
                                    <div class="flex justify-between items-start mb-2">
                                        <h3 class="text-lg font-bold text-earth-800 leading-tight">${item.name}</h3>
                                        <span class="text-lg font-bold text-spice-600 whitespace-nowrap ml-2">₹${item.price}</span>
                                    </div>
                                    <p class="text-sm text-earth-500 flex-grow mb-4">${item.description}</p>
                                    <button data-id="${item.id}" class="add-to-cart-btn w-full bg-earth-100 hover:bg-spice-600 text-earth-700 hover:text-white font-medium py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center group">
                                        <i class="fa-solid fa-plus mr-2 group-hover:rotate-90 transition-transform"></i> Add to Cart
                                    </button>
                                </div>
                            </div>
                        `;
                        container.append(cardHtml);
                    });
                }
            }

            // --- Cart Logic ---
            $(document).on('click', '.add-to-cart-btn', function() {
                const itemId = $(this).data('id');
                const item = menuData.find(i => i.id === itemId);
                
                const btn = $(this);
                const originalHtml = btn.html();
                btn.html('<i class="fa-solid fa-check mr-2"></i> Added');
                btn.removeClass('bg-earth-100 text-earth-700 hover:bg-spice-600').addClass('bg-leaf-500 text-white hover:bg-leaf-600');
                
                setTimeout(() => {
                    btn.html(originalHtml);
                    btn.removeClass('bg-leaf-500 text-white hover:bg-leaf-600').addClass('bg-earth-100 text-earth-700 hover:bg-spice-600');
                }, 1500);

                addToCart(item);
            });

            function addToCart(item) {
                const existingItem = cart.find(cartItem => cartItem.id === item.id);
                if (existingItem) existingItem.qty += 1;
                else cart.push({ id: item.id, name: item.name, price: item.price, category: item.category, qty: 1 });
                
                updateCartUI();
                showToast(`Added ${item.name} to cart`);
            }

            function updateCartUI() {
                const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
                const counter = $('#cart-counter');
                counter.text(totalItems);
                
                if (totalItems > 0) counter.removeClass('scale-0').addClass('scale-100');
                else counter.removeClass('scale-100').addClass('scale-0');

                const container = $('#cart-items-container');
                container.empty();
                let totalPrice = 0;

                if (cart.length === 0) {
                    container.append(`
                        <div id="empty-cart-msg" class="text-center py-12 h-full flex flex-col justify-center items-center">
                            <div class="w-20 h-20 bg-earth-50 rounded-full flex items-center justify-center mb-4">
                                <i class="fa-solid fa-basket-shopping text-3xl text-earth-300"></i>
                            </div>
                            <p class="text-earth-500 font-medium">Your cart is empty.</p>
                        </div>
                    `);
                    $('#checkout-btn').prop('disabled', true);
                } else {
                    $('#checkout-btn').prop('disabled', false);
                    cart.forEach(item => {
                        totalPrice += item.price * item.qty;
                        let dotColor = item.category === 'veg' ? 'bg-leaf-600' : (item.category === 'non-veg' ? 'bg-red-600' : 'bg-yellow-500');

                        container.append(`
                            <div class="flex justify-between items-center p-3 bg-white rounded-lg border border-earth-100 shadow-sm">
                                <div class="flex-grow pr-3">
                                    <h4 class="text-sm font-bold text-earth-800 flex items-center">
                                        <span class="w-2 h-2 rounded-full ${dotColor} mr-2 inline-block"></span>
                                        ${item.name}
                                    </h4>
                                    <div class="text-spice-600 text-sm font-medium mt-1">₹${item.price}</div>
                                </div>
                                <div class="flex items-center space-x-2 bg-earth-50 rounded-lg p-1 border border-earth-200">
                                    <button class="cart-minus-btn w-6 h-6 rounded flex items-center justify-center text-earth-500 hover:bg-white transition-all" data-id="${item.id}">
                                        <i class="fa-solid fa-minus text-xs"></i>
                                    </button>
                                    <span class="text-sm font-bold w-4 text-center">${item.qty}</span>
                                    <button class="cart-plus-btn w-6 h-6 rounded flex items-center justify-center text-earth-500 hover:bg-white transition-all" data-id="${item.id}">
                                        <i class="fa-solid fa-plus text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        `);
                    });
                }
                $('#cart-total').text(totalPrice.toFixed(2));
            }

            $(document).on('click', '.cart-plus-btn', function() {
                const item = cart.find(i => i.id === $(this).data('id'));
                if(item) { item.qty += 1; updateCartUI(); }
            });

            $(document).on('click', '.cart-minus-btn', function() {
                const itemIndex = cart.findIndex(i => i.id === $(this).data('id'));
                if(itemIndex !== -1) {
                    if (cart[itemIndex].qty > 1) cart[itemIndex].qty -= 1;
                    else cart.splice(itemIndex, 1);
                    updateCartUI();
                }
            });

            function openCart() {
                $('#cart-overlay').removeClass('hidden');
                setTimeout(() => {
                    $('#cart-overlay').removeClass('opacity-0');
                    $('#cart-sidebar').addClass('open');
                }, 10);
                $('body').addClass('overflow-hidden');
            }

            function closeCart() {
                $('#cart-sidebar').removeClass('open');
                $('#cart-overlay').addClass('opacity-0');
                setTimeout(() => {
                    $('#cart-overlay').addClass('hidden');
                    $('body').removeClass('overflow-hidden');
                }, 300);
            }

            $('#cart-btn').on('click', openCart);
            $('#close-cart-btn, #cart-overlay').on('click', closeCart);

            $('#checkout-btn').on('click', function() {
                closeCart();
                cart = [];
                updateCartUI();
                setTimeout(() => showToast("Order Placed Successfully!", 'success', 4000), 300);
            });

            function showToast(message, type = 'default', duration = 3000) {
                const toastId = 'toast-' + Date.now();
                const icon = type === 'success' ? '<i class="fa-solid fa-sparkles text-spice-500 mr-3"></i>' : '<i class="fa-solid fa-circle-check text-leaf-500 mr-3"></i>';
                
                $('#toast-container').append(`
                    <div id="${toastId}" class="toast bg-white border border-earth-100 shadow-lg rounded-lg p-4 flex items-center pointer-events-auto max-w-sm ml-auto">
                        ${icon}
                        <p class="text-earth-800 text-sm font-medium">${message}</p>
                    </div>
                `);
                
                setTimeout(() => $(`#${toastId}`).remove(), duration);
            }
        });
    </script>
</body>
</html>
